version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: moidom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moidom
      POSTGRES_PASSWORD: moidom_secret
      POSTGRES_DB: moidom_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moidom -d moidom_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: moidom_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
